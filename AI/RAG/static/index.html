<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RFC RAG Search</title>

<style>
body{
    font-family:Segoe UI,sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
    background:#10141a;
    color:#eee;
}

h1{
    color:#66b3ff;
}

.card{
    background:#1b212b;
    border:1px solid #2f3745;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
}

input,select,button{
    padding:10px;
    border-radius:8px;
    border:1px solid #444;
    background:#0f1319;
    color:white;
}

button{
    cursor:pointer;
}

button:hover{
    background:#263040;
}

.result{
    padding:15px;
    margin-bottom:10px;
    border-radius:8px;
    border:1px solid #333;
    background:#151a22;
}

.answer{
    white-space:pre-wrap;
    line-height:1.6;
}

.chunk{
    white-space:pre-wrap;
    font-size:14px;
    margin-top:10px;
}

.badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:12px;
    background:#2d3645;
    margin-right:6px;
    font-size:12px;
}

.green{
    background:#26452f;
}

.red{
    background:#572727;
}

.meta{
    color:#aaa;
    margin-top:10px;
}

#answerSection{
    margin-top:20px;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<h1>RFC RAG Search</h1>

<div class="card">

    <input
        id="query"
        style="width:55%"
        value="What is DNS?"
        placeholder="Ask a question..."
    >

    <select id="topk">
        <option value="3">Top 3</option>
        <option value="5" selected>Top 5</option>
        <option value="10">Top 10</option>
    </select>

    <button onclick="searchDocs()">
        Search
    </button>

    <button onclick="askRag()">
        Ask RAG
    </button>

</div>

<div class="card">
    <strong>Health</strong>
    <div id="health">
        Loading...
    </div>
</div>

<div id="answerSection" class="hidden card"></div>

<div id="results"></div>

<script>

const healthEl = document.getElementById("health");
const resultsEl = document.getElementById("results");
const answerEl = document.getElementById("answerSection");

function safeNumber(value){
    if(value === undefined || value === null){
        return "N/A";
    }
    return Number(value).toFixed(3);
}

function escapeHtml(text){
    return (text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}

async function loadHealth(){

    try{
        const res = await fetch("/health");
        const data = await res.json();

        healthEl.innerHTML = `
            <div>
                <span class="badge green">
                    ${data.status}
                </span>

                Collection:
                <strong>${data.vector_collection}</strong>

                | Chunks:
                <strong>${data.vector_count}</strong>

                | Embedding Dim:
                <strong>${data.embedding_dim}</strong>

                | LLM:
                <strong>
                    ${data.llm_available
                        ? data.llm_model
                        : "Disabled"}
                </strong>
            </div>
        `;
    }
    catch(err){
        healthEl.innerHTML =
            `<span class="badge red">offline</span>`;
    }
}

function renderSearch(data){

    answerEl.classList.add("hidden");

    resultsEl.innerHTML =
        `<div class="meta">
            Query: ${data.query}
            |
            ${data.took_ms} ms
            |
            Top K: ${data.top_k}
        </div>`;

    for(const item of data.results){

        resultsEl.innerHTML += `
            <div class="result">

                <span class="badge">
                    score ${safeNumber(item.score)}
                </span>

                <span class="badge">
                    distance ${safeNumber(item.distance)}
                </span>

                <span class="badge">
                    ${item.source} #${item.chunk_id}
                </span>

                <div class="chunk">
                    ${escapeHtml(item.text)}
                </div>

            </div>
        `;
    }
}

function renderRag(data){

    answerEl.classList.remove("hidden");

    if(data.error){

        answerEl.innerHTML = `
            <h3>Context Only</h3>
            <p>${data.error}</p>

            <pre>${escapeHtml(data.context)}</pre>
        `;
    }
    else{

        answerEl.innerHTML = `
            <h3>Answer</h3>

            <div class="answer">
                ${escapeHtml(data.answer)}
            </div>
        `;
    }

    resultsEl.innerHTML = "";

    if(data.sources){

        for(const source of data.sources){

            resultsEl.innerHTML += `
                <div class="result">

                    <span class="badge">
                        ${source.source}
                    </span>

                    <span class="badge">
                        Chunk ${source.chunk_id}
                    </span>

                    <span class="badge">
                        Score ${safeNumber(source.score)}
                    </span>

                </div>
            `;
        }
    }
}

async function searchDocs(){

    const query =
        document.getElementById("query").value;

    const top_k =
        Number(document.getElementById("topk").value);

    const res = await fetch("/query",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            query,
            top_k
        })
    });

    const data = await res.json();

    renderSearch(data);
}

async function askRag(){

    const query =
        document.getElementById("query").value;

    const top_k =
        Number(document.getElementById("topk").value);

    const res = await fetch("/rag",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            query,
            top_k
        })
    });

    const data = await res.json();

    renderRag(data);
}

loadHealth();

</script>

</body>
</html>
