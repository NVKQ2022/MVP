[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-core-lib"
version = "0.1.0"
description = "A modular, extensible, and production-ready Retrieval-Augmented Generation (RAG) library."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["rag", "llm", "agentic-rag", "vector-search", "embeddings", "react"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
openai = [
    "openai>=1.0.0",
]
chroma = [
    "chromadb>=0.4.0",
]
embeddings = [
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
]
all = [
    "openai>=1.0.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_core*"]

[tool.setuptools.package-data]
rag_core = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
